name: Sync from Upstream

# 定时把 Yachiyo-5i/xLyra 合进本 fork：
# - main：与上游 main 硬同步（本 fork 不在 main 上叠主题）
# - test：merge 上游 test，保留浅色主题等本地提交；冲突则开 Issue 人工处理
# 合进 test 成功后会触发 Publish Images → Watchtower 可拉新镜像

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream into fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Yachiyo-5i/xLyra.git
          git fetch upstream --tags
          git fetch origin

      - name: Sync main (hard reset to upstream/main)
        run: |
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git reset --hard upstream/main
          git push origin main --force

      - name: Merge upstream/test into test
        id: merge
        run: |
          set -euo pipefail
          git checkout -B test origin/test
          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/test HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "test already contains upstream/test ($before)"
            exit 0
          fi
          if git merge --no-ff upstream/test -m "chore: merge upstream/test into fork test"; then
            after="$(git rev-parse HEAD)"
            git push origin test
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "before=$before" >> "$GITHUB_OUTPUT"
            echo "after=$after" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/test into test: $before -> $after"
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '上游 sync 冲突：无法自动 merge upstream/test → test'
            const body = [
              '定时同步失败：`upstream/test` 与本 fork 的 `test`（含浅色主题等改动）有冲突。',
              '',
              '请本地处理：',
              '```bash',
              'git fetch upstream',
              'git checkout test',
              'git merge upstream/test',
              '# 解决冲突后',
              'git push origin test',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 5,
            })
            const existing = issues.data.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再次冲突：${new Date().toISOString()}\n\n${body}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-sync'],
              })
            }
