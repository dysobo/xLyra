name: Sync from Upstream

# Merge Yachiyo-5i/xLyra test into this fork's test (keeps local theme commits).
# A successful push to test triggers Publish Images -> GHCR -> 1panel Watchtower.
# Do NOT hard-reset main; that would wipe fork CI on the default branch.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream/test into test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Yachiyo-5i/xLyra.git
          git fetch upstream test
          git fetch origin test

      - name: Merge upstream/test into test
        id: merge
        run: |
          set -euo pipefail
          git checkout test
          git reset --hard origin/test
          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/test HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "test already contains upstream/test ($before)"
            exit 0
          fi
          if git merge --no-ff upstream/test -m "chore: merge upstream/test into fork test"; then
            after="$(git rev-parse HEAD)"
            git push origin test
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/test into test: $before -> $after"
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open PR on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="sync/upstream-test-$(date -u +%Y%m%d)"
          git checkout -B "$branch" origin/test
          git fetch upstream test
          git merge upstream/test || true
          git add -A
          git commit -m "wip: conflict merging upstream/test" || true
          git push -u origin "$branch" --force
          existing="$(gh pr list --base test --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR already open: #$existing"
            exit 0
          fi
          gh pr create \
            --base test \
            --head "$branch" \
            --title "Upstream sync conflict: merge upstream/test manually" \
            --body "Scheduled sync failed. Conflict branch \`$branch\` was pushed. Resolve in the PR, merge into \`test\`, then Publish Images will rebuild GHCR for Watchtower."
