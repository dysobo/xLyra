name: Sync from Upstream

# 定时把 Yachiyo-5i/xLyra 的 test 合进本 fork 的 test（保留浅色主题等本地提交）。
# 成功推送 test 后会触发 Publish Images → GHCR → 1panel Watchtower。
# 不硬同步 main，避免冲掉本 fork 放在默认分支上的 CI 工作流。

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream/test into test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Yachiyo-5i/xLyra.git
          git fetch upstream test
          git fetch origin test

      - name: Merge upstream/test into test
        id: merge
        run: |
          set -euo pipefail
          git checkout test
          git reset --hard origin/test
          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/test HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "test already contains upstream/test ($before)"
            exit 0
          fi
          if git merge --no-ff upstream/test -m "chore: merge upstream/test into fork test"; then
            after="$(git rev-parse HEAD)"
            git push origin test
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/test into test: $before -> $after"
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open PR on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="sync/upstream-test-$(date -u +%Y%m%d)"
          git checkout -B "$branch" origin/test
          # 留下冲突标记分支，便于人工处理
          git fetch upstream test
          git merge upstream/test || true
          git add -A
          git commit -m "wip: conflict merging upstream/test" || true
          git push -u origin "$branch" --force
          gh pr create \
            --base test \
            --head "$branch" \
            --title "上游 sync 冲突：请手动合并 upstream/test" \
            --body "定时同步失败，已推送冲突分支 \`$branch\`。请在 PR 中解决后合并到 \`test\`，合并后会自动发布镜像。" \
            || true
